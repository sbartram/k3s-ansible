---
# Wait for the actual apt lock files to be free, instead of pattern-matching
# process names. Process-name matching gets false positives from the
# unattended-upgrade-shutdown signal-waiter daemon, which is always running
# but never holds the apt lock. flock(1) is what apt itself uses internally,
# so blocking on the same lock files is the canonical wait.
- name: Wait for apt lists lock to be free
  ansible.builtin.command: >-
    flock --wait {{ os_upgrade_apt_lock_timeout }}
    /var/lib/apt/lists/lock --command true
  changed_when: false

- name: Wait for dpkg frontend lock to be free
  ansible.builtin.command: >-
    flock --wait {{ os_upgrade_apt_lock_timeout }}
    /var/lib/dpkg/lock-frontend --command true
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ os_upgrade_apt_lock_timeout }}"

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: "{{ os_upgrade_apt_upgrade_type }}"
    lock_timeout: "{{ os_upgrade_apt_lock_timeout }}"

- name: Autoremove unused packages
  when: os_upgrade_autoremove
  ansible.builtin.apt:
    autoremove: true
    lock_timeout: "{{ os_upgrade_apt_lock_timeout }}"
